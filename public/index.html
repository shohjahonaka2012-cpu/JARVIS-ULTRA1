
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>JARVIS ULTRA | Personal AI</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #0d1b2c;
      --line: #1b3850;
      --cyan: #35e6ff;
      --text: #e9f7ff;
      --muted: #8da8bc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #102b43, var(--bg) 65%);
      color: var(--text);
      font-family: system-ui, Arial, sans-serif;
    }
    button, textarea { font: inherit; }
    button { cursor: pointer; }
    .app {
      max-width: 900px;
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0 18px;
      border-bottom: 1px solid var(--line);
    }
    .logo {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid var(--cyan);
      border-radius: 50%;
      color: var(--cyan);
      font-size: 25px;
      box-shadow: 0 0 22px #35e6ff25;
    }
    h1 { font-size: 19px; letter-spacing: 2px; margin: 0; }
    .status { color: var(--cyan); font-size: 12px; margin-top: 5px; }
    .top-actions { margin-left: auto; display: flex; gap: 7px; }
    .small-btn, .send-btn, .mic-btn {
      color: var(--text);
      background: #10273a;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .small-btn:hover, .mic-btn:hover { border-color: var(--cyan); }
    .hero { text-align: center; padding: 28px 10px 20px; }
    .orb {
      width: 92px;
      height: 92px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      color: var(--cyan);
      font-size: 37px;
      box-shadow: 0 0 28px #35e6ff30, inset 0 0 24px #35e6ff15;
      animation: glow 3s infinite ease-in-out;
    }
    @keyframes glow {
      50% { box-shadow: 0 0 40px #35e6ff50, inset 0 0 30px #35e6ff25; }
    }
    .hero h2 { margin: 0 0 8px; font-size: 23px; }
    .hero p { margin: 0; color: var(--muted); font-size: 14px; }
    .chat {
      flex: 1;
      min-height: 200px;
      padding: 8px 0 20px;
    }
    .message {
      max-width: 88%;
      width: fit-content;
      padding: 12px 15px;
      border-radius: 16px;
      margin: 12px 0;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .assistant {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top-left-radius: 4px;
    }
    .user {
      margin-left: auto;
      background: #103348;
      border: 1px solid #1b627b;
      border-top-right-radius: 4px;
    }
    .who {
      display: block;
      color: var(--cyan);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 5px;
      letter-spacing: .5px;
    }
    .typing { color: var(--muted); font-size: 13px; padding: 8px; }
    .composer {
      position: sticky;
      bottom: 0;
      padding: 12px 0 max(12px, env(safe-area-inset-bottom));
      background: linear-gradient(transparent, var(--bg) 20%);
    }
    .input-wrap {
      display: flex;
      gap: 8px;
      align-items: end;
      padding: 8px;
      background: #0b1928;
      border: 1px solid var(--line);
      border-radius: 18px;
    }
    textarea {
      flex: 1;
      min-width: 0;
      resize: vertical;
      max-height: 150px;
      min-height: 42px;
      padding: 11px 7px;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
    }
    textarea::placeholder { color: #70899d; }
    .send-btn {
      background: var(--cyan);
      color: #03121d;
      border-color: var(--cyan);
      font-weight: 800;
      padding: 11px 15px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .note { text-align: center; color: var(--muted); font-size: 11px; margin-top: 9px; }
    @media (max-width: 480px) {
      .app { padding: 12px; }
      h1 { font-size: 16px; }
      .small-btn { padding: 9px; }
      .hero { padding-top: 22px; }
      .message { max-width: 94%; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">✧</div>
    <div>
      <h1>JARVIS ULTRA</h1>
      <div class="status">● AI SYSTEM ONLINE</div>
    </div>
    <div class="top-actions">
      <button class="small-btn" id="langBtn" title="Tilni almashtirish">UZ</button>
      <button class="small-btn" id="clearBtn" title="Suhbatni tozalash">🗑</button>
    </div>
  </header>

  <section class="hero">
    <div class="orb">J</div>
    <h2 id="greeting">Xush kelibsiz, Janob Shohjahon</h2>
    <p id="subtitle">Men sizning shaxsiy AI yordamchingizman.</p>
  </section>

  <main class="chat" id="messages" aria-live="polite"></main>

  <div class="typing" id="typing" hidden>JARVIS javob tayyorlamoqda...</div>

  <section class="composer">
    <div class="input-wrap">
      <button class="mic-btn" id="micBtn" title="Ovoz orqali gapirish">🎙️</button>
      <textarea id="prompt" rows="1" placeholder="Janob Shohjahon, qanday yordam beray?"></textarea>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
    <div class="note" id="footnote">JARVIS ULTRA · Shaxsiy AI yordamchi</div>
  </section>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const STORAGE_KEY = "jarvisUltraHistory";
  const LANG_KEY = "jarvisUltraLanguage";

  let history = [];
  let language = localStorage.getItem(LANG_KEY) || "uz";
  let busy = false;
  let recognition = null;

  const messagesEl = $("messages");
  const promptEl = $("prompt");
  const sendBtn = $("sendBtn");
  const typingEl = $("typing");

  const words = {
    uz: {
      greeting: "Xush kelibsiz, Janob Shohjahon",
      subtitle: "Men sizning shaxsiy AI yordamchingizman.",
      placeholder: "Janob Shohjahon, qanday yordam beray?",
      send: "➤",
      welcome: "Assalomu alaykum, Janob Shohjahon! Men JARVIS ULTRA, sizning shaxsiy AI yordamchingizman. Sizga qanday yordam beray?",
      thinking: "JARVIS javob tayyorlamoqda...",
      error: "Kechirasiz, hozir javob olib bo‘lmadi. Birozdan keyin yana urinib ko‘ring.",
      cleared: "Suhbat tozalandi. Qanday yordam beray?",
      confirmClear: "Barcha suhbat tarixini o‘chirmoqchimisiz?",
      user: "JANOB SHOHJAHON",
      assistant: "JARVIS ULTRA"
    },
    en: {
      greeting: "Welcome, Mr. Shohjahon",
      subtitle: "I am your personal AI assistant.",
      placeholder: "Mr. Shohjahon, how can I help?",
      send: "➤",
      welcome: "Hello, Mr. Shohjahon! I am JARVIS ULTRA, your personal AI assistant. How may I help you?",
      thinking: "JARVIS is preparing a response...",
      error: "Sorry, I could not get a response. Please try again shortly.",
      cleared: "Chat cleared. How can I help?",
      confirmClear: "Do you want to delete the entire chat history?",
      user: "MR. SHOHJAHON",
      assistant: "JARVIS ULTRA"
    }
  };

  function saveChat() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {
      console.warn("Chat history could not be saved.", e);
    }
  }

  function addMessage(role, content) {
    const item = document.createElement("div");
    item.className = "message " + (role === "user" ? "user" : "assistant");

    const who = document.createElement("span");
    who.className = "who";
    who.textContent = role === "user" ? words[language].user : words[language].assistant;

    const body = document.createElement("div");
    body.textContent = String(content ?? "");

    item.append(who, body);
    messagesEl.appendChild(item);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return item;
  }

  function renderHistory() {
    messagesEl.replaceChildren();
    history.forEach(item => {
      if (item && (item.role === "user" || item.role === "assistant")) {
        addMessage(item.role, item.content);
      }
    });
  }

  function loadHistory() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      if (Array.isArray(saved)) {
        history = saved.filter(item =>
          item &&
          (item.role === "user" || item.role === "assistant") &&
          typeof item.content === "string"
        );
      }
    } catch (e) {
      history = [];
    }

    if (history.length) {
      renderHistory();
    } else {
      history = [{
        role: "assistant",
        content: words[language].welcome
      }];
      saveChat();
      renderHistory();
    }
  }

  function updateLanguage() {
    const w = words[language];
    document.documentElement.lang = language;
    $("greeting").textContent = w.greeting;
    $("subtitle").textContent = w.subtitle;
    promptEl.placeholder = w.placeholder;
    $("langBtn").textContent = language.toUpperCase();
    typingEl.textContent = w.thinking;
    $("footnote").textContent = "JARVIS ULTRA · " +
      (language === "uz" ? "Shaxsiy AI yordamchi" : "Personal AI assistant");
    renderHistory();
  }

  async function sendMessage() {
    const text = promptEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    promptEl.disabled = true;

    history.push({ role: "user", content: text });
    saveChat();
    addMessage("user", text);
    promptEl.value = "";
    typingEl.hidden = false;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          history: history.slice(-20),
          language: language
        })
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || data.message || "HTTP " + response.status);
      }

      if (typeof data.reply !== "string" || !data.reply.trim()) {
        throw new Error("Server javobida reply topilmadi");
      }

      history.push({ role: "assistant", content: data.reply });
      saveChat();
      addMessage("assistant", data.reply);
    } catch (error) {
      console.error("JARVIS API error:", error);
      const message = words[language].error;
      addMessage("assistant", message);
    } finally {
      typingEl.hidden = true;
      busy = false;
      sendBtn.disabled = false;
      promptEl.disabled = false;
      promptEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);

  promptEl.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  $("clearBtn").addEventListener("click", () => {
    if (!confirm(words[language].confirmClear)) return;
    history = [{
      role: "assistant",
      content: words[language].cleared
    }];
    saveChat();
    renderHistory();
  });

  $("langBtn").addEventListener("click", () => {
    language = language === "uz" ? "en" : "uz";
    localStorage.setItem(LANG_KEY, language);
    updateLanguage();
  });

  $("micBtn").addEventListener("click", () => {
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      addMessage("assistant",
        language === "uz"
          ? "Brauzeringiz ovozli kiritishni qo‘llab-quvvatlamaydi. Chrome brauzerida sinab ko‘ring."
          : "Your browser does not support speech recognition. Try Chrome.");
      return;
    }

    if (recognition) {
      recognition.stop();
      recognition = null;
      return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = language === "uz" ? "uz-UZ" : "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = event => {
      promptEl.value = event.results[0][0].transcript;
      recognition = null;
      sendMessage();
    };

    recognition.onerror = () => {
      recognition = null;
      addMessage("assistant",
        language === "uz"
          ? "Mikrofon ishlamadi. Brauzer ruxsatlarini tekshiring."
          : "Microphone failed. Check browser permissions.");
    };

    recognition.onend = () => { recognition = null; };
    recognition.start();
  });

  // Matnni ovoz chiqarib o'qish uchun xabarni bosib turing.
  messagesEl.addEventListener("dblclick", event => {
    const message = event.target.closest(".message");
    if (!message || !("speechSynthesis" in window)) return;

    const body = message.querySelector("div");
    if (!body) return;

    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(body.textContent);
    utterance.lang = language === "uz" ? "uz-UZ" : "en-US";
    window.speechSynthesis.speak(utterance);
  });

  updateLanguage();
  loadHistory();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
